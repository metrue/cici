name: PR Tests

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'data/memos.json'
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/memos.json'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Run build
      run: npm run build

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          coverage/
          test-results.xml
        retention-days: 7

  type-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type check
      run: npx tsc --noEmit

  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build:cli

    - name: Start server and verify
      run: |
        export NEXTAUTH_SECRET=smoke-test-secret-do-not-use-in-prod
        export NEXTAUTH_URL=http://localhost:3456
        export CICI_DIR=$PWD/sample-content
        export PORT=3456
        node .next/standalone/server.js &
        SERVER_PID=$!
        for i in $(seq 1 30); do
          if curl -sf http://localhost:3456 > /tmp/homepage.html 2>&1; then break; fi
          sleep 1
        done
        echo "=== Status: $? ==="
        curl -sf http://localhost:3456 | grep -q "Powered by" && echo "Homepage OK" || { echo "FAIL: homepage"; kill $SERVER_PID; exit 1; }
        curl -sf http://localhost:3456/blog/hello-cici | grep -q "Hello, cici" && echo "Blog post OK" || { echo "FAIL: blog post"; kill $SERVER_PID; exit 1; }
        kill $SERVER_PID

