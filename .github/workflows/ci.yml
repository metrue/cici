name: CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'data/memos.json'
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/memos.json'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm test -- --coverage

    - name: Build application
      run: npm run build

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: success()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        fail_ci_if_error: false

    - name: Smoke test (start server and verify)
      run: |
        npm run build:cli
        export NEXTAUTH_SECRET=smoke-test-secret-do-not-use-in-prod
        export NEXTAUTH_URL=http://localhost:4567
        export CICI_DIR=$PWD/sample-content
        export PORT=4567
        node .next/standalone/server.js &
        SERVER_PID=$!
        for i in $(seq 1 30); do
          if curl -s http://localhost:4567 > /dev/null 2>&1; then break; fi
          sleep 1
        done
        curl -sf http://localhost:4567 | grep -q "Powered by" || { echo "FAIL: homepage"; kill $SERVER_PID; exit 1; }
        curl -sf http://localhost:4567/blog/hello-cici | grep -q "Hello, cici" || { echo "FAIL: blog post"; kill $SERVER_PID; exit 1; }
        echo "Smoke test passed"
        kill $SERVER_PID

